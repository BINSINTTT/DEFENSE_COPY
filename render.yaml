services:
  - type: web
    name: tomato-insight-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 validation_api:app
    envVars:
      - key: ULTRALYTICS_LEAF_VALIDATION_URL
        value: https://predict-6ae37ce0bbd46ce898ad6e66-dproatj77a-df.a.run.app/predict
      - key: ULTRALYTICS_VALIDATION_API_KEY
        sync: false
      - key: ULTRALYTICS_DISEASE_DETECTION_URL
        value: https://predict-6aff18b5edc2675a21b3a417-dproatj77a-de.a.run.app/predict
      - key: ULTRALYTICS_DISEASE_DETECTION_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
